<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="casingGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="55%" stop-color="#c9c9c9"/>
      <stop offset="100%" stop-color="#8f8f8f"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa0ff"/>
      <stop offset="100%" stop-color="#0060c0"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a9a9a9"/>
    </radialGradient>
  </defs>

  <!-- Motor casing / cooling fan cover -->
  <circle cx="100" cy="100" r="95" fill="url(#casingGrad)" stroke="#000000" stroke-width="3"/>

  <!-- Cover vent ring -->
  <circle cx="100" cy="100" r="87" fill="none" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Fan blades (rotor) -->
  <g id="rotorBlades">
    <path d="M 125.61,95.49 Q 159.39,118.16 167.98,145.85 L 165.49,149.35 Q 159.39,118.16 125.61,104.51 Z" fill="url(#bladeGrad)" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M 119.49,117.20 Q 122.83,157.75 106.54,181.74 L 102.25,181.97 Q 122.83,157.75 112.43,122.83 Z" fill="url(#bladeGrad)" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M 98.70,125.97 Q 69.08,153.86 40.17,156.07 L 37.32,152.87 Q 69.08,153.86 89.90,123.96 Z" fill="url(#bladeGrad)" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M 78.89,115.18 Q 38.62,109.41 18.86,88.18 L 19.59,83.95 Q 38.62,109.41 74.97,107.04 Z" fill="url(#bladeGrad)" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M 74.97,92.96 Q 54.37,57.87 58.65,29.19 L 62.41,27.12 Q 54.37,57.87 78.89,84.82 Z" fill="url(#bladeGrad)" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M 89.90,76.04 Q 104.49,38.06 129.58,23.52 L 133.54,25.17 Q 104.49,38.06 98.70,74.03 Z" fill="url(#bladeGrad)" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M 112.43,77.17 Q 151.22,64.89 178.24,75.44 L 179.41,79.57 Q 151.22,64.89 119.49,82.80 Z" fill="url(#bladeGrad)" stroke="#1a1a1a" stroke-width="1"/>
  </g>

  <!-- Center hub -->
  <circle cx="100" cy="100" r="20" fill="url(#hubGrad)" stroke="#000000" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="5" fill="#4a4a4a"/>

  <!-- Mount bolts around casing -->
  <circle cx="100" cy="17" r="4.5" fill="#4a4a4a" stroke="#000" stroke-width="1"/>
  <circle cx="171.88010851410843" cy="141.5" r="4.5" fill="#4a4a4a" stroke="#000" stroke-width="1"/>
  <circle cx="28.119891485891586" cy="141.5" r="4.5" fill="#4a4a4a" stroke="#000" stroke-width="1"/>
</svg>

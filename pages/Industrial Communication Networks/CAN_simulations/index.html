<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN</title>
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="./../../../shared/css/notyf.min.css">
    <script src="../../../shared/js/chart.umd.js"></script>
    <script src="../../../shared/js/chartjs-plugin-annotation.js"></script>
    <script src="../../../shared/js/notyf.min.js"></script>

    <style>
        :root {
            --navy: #173681;
            --gold: #e1ac3d;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--navy);
            color: #fff;
            border-top: 1px solid #0f245c;
            border-bottom: 3px solid var(--gold);
        }

        .left-header {
            /* background: transparent; */
            display: flex;
            align-items: center;
            /* padding: 10px; */
            height: 58px;
        }

        #header-logo {
            height: 90px;
            object-fit: contain;
            margin-left: 43px;
            margin-top: -10px;
        }

        #header-title {
            flex-grow: 1;
            text-align: center;
            font-size: 1.5vw;
            font-weight: bold;
            color: #fff;
            margin-left: -150px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            margin-right: 20px;
            background-color: #edeff1;
            border-radius: 20px;
            border: 1px solid #d6d6d6;
            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease-in-out;
        }

        .back-button img { height: 18px; }

        .back-button:hover {
            background-color: #dee2e6;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <header>
        <div class="left-header">
            <a href="../../../index.html"><img id="header-logo" src="../../../assets/Scientech logo-2.png" alt="Logo"></a>
        </div>
        <div id="header-title">Controller Area Network (CAN)</div>
        <!-- <a href="../index.html" class="back-button">
            <img src="../../../shared/img/back.png" alt="">
            <span>Back to Course</span>
        </a> -->
    </header>
    <div id="app">
        <svg id="connections"></svg>
        <svg id="node-video-connections"></svg>
        <svg id="node-video-connections1"></svg>
        <div class="left-col">
            <div class="node" id="main-node">
                <div class="node-end-container">
                    <div class="node-end">CAN_H</div>
                    <div class="node-end">CAN_L</div>
                </div>
                <img src="img/can-module.png" alt="" class="node-img">
                <div class="node-heading">MAIN NODE</div>
            </div>

            <div class="switch-container">
                <h3 style="margin: 0;">User Control Switches</h3>
                <button class="switch" data-active="false" onclick="playVideo('hornVideo', 'node-1', this)">Horn (NODE 1)</button>
                <button class="switch" data-active="false" onclick="playVideo('wiperVideo', 'node-2', this)">Wiper (NODE 2)</button>
                <button class="switch" data-active="false" onclick="playVideo('fanVideo', 'node-3', this)">AC (NODE 3)</button>
                <button class="switch" data-active="false" onclick="playVideo('indicatorVideo', 'node-4', this)">Headlights (NODE 4)</button>
            </div>
        </div>

        <div class="right-col">
            <div class="top-row">
                <div class="node-col">
                    <button style="background:#5dbea3;" onclick="toggleConnection(event)">Connected</button>
                    <div class="node" id="node-1">
                        <div class="node-end-container">
                            <div class="node-end">CAN_H</div>
                            <div class="node-end">CAN_L</div>
                        </div>
                        <img src="img/can-module.png" alt="" class="node-img">
                        <div class="node-heading">NODE 1</div>
                    </div>
                </div>

                <div class="node-col">
                    <button style="background:#5dbea3;" onclick="toggleConnection(event)">Connected</button>
                    <div class="node" id="node-2">
                        <div class="node-end-container">
                            <div class="node-end">CAN_H</div>
                            <div class="node-end">CAN_L</div>
                        </div>
                        <img src="img/can-module.png" alt="" class="node-img">
                        <div class="node-heading">NODE 2</div>
                    </div>
                </div>

                <div class="node-col">
                    <button style="background:#5dbea3;" onclick="toggleConnection(event)">Connected</button>
                    <div class="node" id="node-3">
                        <div class="node-end-container">
                            <div class="node-end">CAN_H</div>
                            <div class="node-end">CAN_L</div>
                        </div>
                        <img src="img/can-module.png" alt="" class="node-img">
                        <div class="node-heading">NODE 3</div> 
                    </div>
                </div>

                <div class="node-col">
                    <button style="background:#5dbea3;" onclick="toggleConnection(event)">Connected</button>
                    <div class="node" id="node-4">
                        <div class="node-end-container">
                            <div class="node-end">CAN_H</div>
                            <div class="node-end">CAN_L</div>
                        </div>
                        <img src="img/can-module.png" alt="" class="node-img">
                        <div class="node-heading">NODE 4</div>
                    </div>
                </div>
                
            </div>
    
            <div class="bottom-row">
                <div class="components-container">
                    <video src="img/car-horn.mp4" id="hornVideo"></video>
                    <video src="img/wiper.mp4" id="wiperVideo"></video>
                    <video src="img/fan.mp4" id="fanVideo"></video>
                    <video src="img/indicator.mp4" id="indicatorVideo"></video>
                </div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
